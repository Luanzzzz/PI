<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área do Estudante | Portal de Cursos Atibaia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/CUsuario.css">
  <script src="JS/scriptUsuario.js" defer></script>
</head>
<body>
  <header class="student-header">
    <div class="student-header__inner">
      <a class="student-brand" href="usuario.html">
        <img src="images/logoAtibaia.png" alt="Prefeitura de Atibaia" class="student-brand__logo">
        <span>Portal de Cursos</span>
      </a>
      <nav class="student-actions" aria-label="Ações do estudante">
        <a href="home.html" class="btn btn-secondary">Início</a>
        <a href="home.html" class="btn btn-primary sair-aluno">Sair</a>
      </nav>
    </div>
  </header>

  <main class="student-page">
    <section class="student-hero">
      <p class="eyebrow">Área do estudante</p>
      <h1>Meus cursos</h1>
      <p>Acompanhe as informações dos cursos em que você está matriculado.</p>
    </section>

    <section class="courses-list" id="cursos-aluno" aria-label="Cursos matriculados"></section>
  </main>
</body>
</html>
