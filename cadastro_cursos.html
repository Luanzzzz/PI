<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Curso | Portal de Cursos Atibaia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/CCadastro_cursos.css">
  <script src="JS/scriptCadastro_curso.js" defer></script>
</head>
<body>
  <header class="admin-header">
    <div class="admin-header__inner">
      <a class="admin-brand" href="home_ADM.html">
        <img src="images/logoAtibaia.png" alt="Prefeitura de Atibaia" class="admin-brand__logo">
        <span>Portal de Cursos</span>
      </a>
      <nav class="admin-actions" aria-label="Ações administrativas">
        <a href="home_ADM.html" class="btn btn-secondary">Voltar</a>
        <a href="home.html" class="btn btn-primary sair-admin">Sair</a>
      </nav>
    </div>
  </header>

  <main class="admin-page">
    <section class="form-shell">
      <div class="section-heading">
        <p class="eyebrow">Administração</p>
        <h1>Cadastrar curso</h1>
        <p>Preencha as informações principais do curso para exibição no portal.</p>
      </div>

      <form action="#" method="post" class="admin-form">
        <div class="form-group">
          <label for="nomeCurso">Nome do curso</label>
          <input type="text" id="nomeCurso" name="nomeCurso" placeholder="Digite o nome do curso">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="instituicao">Instituição de ensino</label>
            <input type="text" id="instituicao" name="instituicao" placeholder="Ex: SENAI, ETEC">
          </div>

          <div class="form-group">
            <label for="cargaHoraria">Carga horária</label>
            <input type="text" id="cargaHoraria" name="cargaHoraria" placeholder="Ex: 40 horas">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="categoria">Categoria</label>
            <input type="text" id="categoria" name="categoria" placeholder="Ex: Tecnologia, Saúde">
          </div>

          <div class="form-group">
            <label for="vagas">Quantidade de vagas</label>
            <input type="number" id="vagas" name="vagas" min="1" placeholder="Ex: 16">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" placeholder="Ex: Unidade Centro - Atibaia">
          </div>

          <div class="form-group">
            <label for="horario">Horário</label>
            <input type="text" id="horario" name="horario" placeholder="Ex: Terças e quintas, das 18h30 às 20h30">
          </div>
        </div>

        <div class="form-group">
          <label for="descricao">Descrição do curso</label>
          <textarea id="descricao" name="descricao" rows="5" placeholder="Detalhes do curso"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Salvar cadastro</button>
      </form>
    </section>
  </main>
</body>
</html>
