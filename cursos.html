<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos Disponíveis | Portal de Cursos Atibaia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/CCursos.css">
  <link rel="stylesheet" href="css/footer.css">
  <script src="JS/scriptCursos.js" defer></script>
</head>
<body>
  <header class="public-header">
    <div class="public-header__inner">
      <a class="brand" href="home.html" aria-label="Portal de Cursos Atibaia">
        <img src="images/logoAtibaia.png" alt="Prefeitura de Atibaia" class="brand__logo">
        <span class="brand__text">Portal de Cursos</span>
      </a>

      <nav class="main-nav" aria-label="Navegação principal">
        <a href="home.html" class="nav-link">Início</a>
        <a href="cursos.html" class="nav-link active">Cursos</a>
        <a href="cadastro_alunos.html" class="nav-link">Inscrição</a>
        <a href="#contato" class="nav-link">Contato</a>
      </nav>

      <div class="header-actions">
        <a href="cadastro_alunos.html" class="btn btn-outline">Cadastrar</a>
        <a href="home.html#login-modal" class="btn btn-primary">Entrar</a>
      </div>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <p class="eyebrow">Cursos gratuitos</p>
      <h1>Cursos disponíveis</h1>
      <p>Escolha uma das formações oferecidas pela Prefeitura de Atibaia e avance para o cadastro.</p>
    </section>

    <section class="courses-section" aria-label="Lista de cursos">
      <div class="courses-grid"></div>
    </section>
  </main>

  <footer class="public-footer" id="contato">
    <div class="public-footer__inner">
      <div class="public-footer__brand">
        <img src="images/logo_atibaia_fundo_transparente.png" alt="Prefeitura de Atibaia">
        <p>Portal de Cursos da Prefeitura de Atibaia</p>
      </div>

      <div class="public-footer__contact">
        <p><strong>Telefone:</strong> (11) 4414-2000</p>
        <div class="public-footer__links">
          <a href="https://www.instagram.com/prefatibaia/" target="_blank" rel="noopener">Instagram</a>
          <a href="https://www.facebook.com/prefatibaia" target="_blank" rel="noopener">Facebook</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
