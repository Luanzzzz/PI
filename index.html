<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
#section-header {
    width: 100%;
    background-color: #ffffff;
    position: relative;
    z-index: 10;
  }
  .site-header {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 30px 80px;
  }
  .brand {
    font-size: 24px;
    font-weight: 700;
    color: #c62828;
  }
  .main-nav {
    display: flex;
    align-items: center;
    gap: 45px;
  }
  .nav-link {
    position: relative;
    text-decoration: none;
    color: #000000;
    font-size: 18px;
    font-weight: 500;
    padding: 5px 0;
  }
  .nav-link.active {
    color: #c62828;
  }
  .nav-underline {
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 100%;
    height: 2px;
    object-fit: cover;
  }
  .header-actions {
    display: flex;
    gap: 20px;
  }
  .header-actions .btn {
    min-width: 140px;
    height: 50px;
    font-size: 18px;
  }

  @media (max-width: 1024px) {
    .site-header { padding: 20px 40px; }
    .main-nav { gap: 25px; }
  }
  @media (max-width: 768px) {
    .site-header { flex-direction: column; gap: 20px; padding: 20px; }
    .main-nav { flex-wrap: wrap; justify-content: center; }
  }

/* CSS for section section:Hero */
#section-hero {
    width: 100%;
    position: relative;
    overflow: hidden;
    background-color: #ffffff;
  }
  .hero-container {
    max-width: 1440px;
    margin: 0 auto;
    position: relative;
    min-height: 850px;
    padding-top: 180px;
    padding-bottom: 100px;
  }
  .hero-bg-shape {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 55%;
    background-color: rgba(198, 40, 40, 0.4);
    clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%);
    z-index: 1;
  }
  .hero-content {
    position: relative;
    z-index: 2;
    padding: 0 80px;
    max-width: 850px;
  }
  .hero-title {
    font-size: 68px;
    font-weight: 800;
    color: #000000;
    margin: 0 0 25px 0;
    line-height: 1.1;
    letter-spacing: -1px;
  }
  .hero-subtitle {
    font-size: 68px;
    font-weight: 800;
    margin: 0 0 60px 0;
    line-height: 1.1;
    display: flex;
    gap: 20px;
    letter-spacing: -1px;
  }
  .text-black {
    color: #000000;
  }
  .text-red {
    color: #c62828;
  }
  .hero-description {
    font-size: 20px;
    line-height: 1.8;
    color: #333333;
    margin: 0 0 80px 0;
    max-width: 650px;
  }
  .hero-buttons {
    display: flex;
    gap: 30px;
  }
  .btn-large {
    padding: 18px 36px;
    font-size: 18px;
    min-width: 260px;
    height: 64px;
  }

  @media (max-width: 1024px) {
    .hero-container { min-height: 600px; padding-top: 100px; }
    .hero-content { padding: 0 40px; }
    .hero-title, .hero-subtitle { font-size: 48px; }
    .hero-bg-shape { width: 60%; clip-path: polygon(15% 0, 100% 0, 100% 100%, -10% 100%); }
  }
  @media (max-width: 768px) {
    .hero-container { padding-top: 60px; }
    .hero-content { padding: 0 20px; }
    .hero-title, .hero-subtitle { font-size: 36px; flex-direction: column; gap: 10px; }
    .hero-description { font-size: 16px; margin-bottom: 40px; }
    .hero-buttons { flex-direction: column; gap: 15px; }
    .btn-large { width: 100%; min-width: auto; }
    .hero-bg-shape { width: 100%; clip-path: polygon(0 60%, 100% 40%, 100% 100%, 0 100%); opacity: 0.15; }
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-header">
  <header class="site-header">
    <div class="brand">Portal de cursos Atibaia</div>
    <nav class="main-nav">
      <a href="#" class="nav-link active">
        Inicio
        <img src="images/20_24.svg" alt="" class="nav-underline">
      </a>
      <a href="#" class="nav-link">Cursos</a>
      <a href="#" class="nav-link">Inscrição</a>
      <a href="#" class="nav-link">Contato</a>
    </nav>
    <div class="header-actions">
      <button class="btn btn-outline">Cadastar</button>
      <button class="btn btn-primary">Entrar</button>
    </div>
  </header>
</section>
<section id="section-hero">
  <div class="hero-container">
    <div class="hero-bg-shape"></div>
    <div class="hero-content">
      <h1 class="hero-title">Transforme seu futuro</h1>
      <h2 class="hero-subtitle">
        <span class="text-black">com</span>
        <span class="text-red">Educação Gratuita</span>
      </h2>
      <p class="hero-description">
        A Prefeitura de Atibaia oferece cursos de qualificação<br>
        profissional para impulsionar sua carreira e o desenvolvimento regional
      </p>
      <div class="hero-buttons">
        <button class="btn btn-primary btn-large">Ver cusrsos disponiveis</button>
        <button class="btn btn-secondary btn-large">Como funciona?</button>
      </div>
    </div>
  </div>
</section>
</body>
</html>
